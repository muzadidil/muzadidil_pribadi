<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d2c3a">
<title>Offline - Gudang Password</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background: #1d2c3a; color: #c5ced6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  h1 { color: #fff; font-size: 20px; margin-bottom: 10px; }
  p { font-size: 14px; line-height: 1.6; margin-bottom: 22px; }
  button { height: 44px; padding: 0 24px; border: 0; border-radius: 4px; background: #00abdb; color: #fff; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div>
  <h1>Tidak ada koneksi</h1>
  <p>Data password hanya bisa dibuka saat online,<br>agar tidak tersimpan di perangkat.</p>
  <button onclick="location.reload()">Coba lagi</button>
</div>
</body>
</html>
