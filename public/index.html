<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Gudang Password - muzadidil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; color: #333; background: #fff; }
  button { font-family: inherit; }
  .app { display: flex; height: 100vh; }

  /* SIDEBAR */
  .sidebar { width: 220px; background: #1d2c3a; color: #c5ced6; display: flex; flex-direction: column; flex-shrink: 0; user-select: none; }
  .brand { height: 76px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #16222d; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  .brand span { color: #00abdb; margin-right: 6px; }
  .acct { padding: 14px 22px; border-bottom: 1px solid #16222d; display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .ava { width: 34px; height: 34px; border-radius: 50%; background: #2574a9; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .acct b { color: #fff; display: block; font-size: 13px; }
  .acct small { color: #9aa8b6; }
  nav { flex: 1; padding: 6px 0; }
  nav a { display: block; padding: 13px 22px; font-size: 13px; color: #c5ced6; text-decoration: none; cursor: pointer; border-left: 3px solid transparent; }
  nav a:hover { color: #fff; background: #223344; }
  nav a.active { color: #fff; font-weight: 600; background: #223344; border-left-color: #00abdb; }
  .side-foot { padding: 16px 22px; border-top: 1px solid #283a4b; background: #1f2f3e; }
  .side-foot button { width: 100%; height: 32px; background: none; border: 1px solid #3a4f63; color: #ff8a8a; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .side-foot button:hover { background: #2a3d50; }

  /* MAIN */
  main { flex: 1; min-width: 0; overflow-y: auto; padding: 26px 34px 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 600; color: #2c3a47; }
  .btn { height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid #d3d9df; background: #fff; color: #444; cursor: pointer; font-size: 13px; }
  .btn:hover { background: #f4f6f8; }
  .btn.primary { background: #00abdb; border-color: #00abdb; color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #0099c4; }
  .btn.danger { color: #e0443e; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
  .hamb { display: none; }

  /* DASHBOARD */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { border: 1px solid #e3e8ed; border-radius: 6px; padding: 18px 20px; }
  .card .lbl { font-size: 12px; color: #8a96a3; text-transform: uppercase; letter-spacing: .5px; }
  .card .val { font-size: 32px; font-weight: 600; color: #2c3a47; margin-top: 6px; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { border: 1px solid #e3e8ed; border-radius: 6px; padding: 18px 20px; }
  .panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: #2c3a47; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .bar-row .nm { width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .track { flex: 1; height: 10px; background: #eef2f5; border-radius: 5px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: #00abdb; border-radius: 5px; }
  .bar-row .ct { width: 32px; text-align: right; color: #5b6772; }
  .recent-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f0f3f5; font-size: 13px; gap: 10px; }
  .recent-row:last-child { border: 0; }
  .recent-row .tech { color: #8a96a3; flex-shrink: 0; }
  .empty { color: #8a96a3; font-size: 13px; padding: 8px 0; }

  /* TABEL PASSWORD */
  .tools { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .tools input, .tools select { height: 36px; border: 1px solid #d3d9df; border-radius: 4px; padding: 0 12px; font-size: 13px; background: #fff; }
  .tools input { flex: 1; min-width: 200px; }
  .tools input:focus, .tools select:focus { outline: none; border-color: #00abdb; }
  .tbl-wrap { border: 1px solid #e3e8ed; border-radius: 6px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; background: #f6f8fa; color: #5b6772; font-weight: 600; padding: 11px 14px; border-bottom: 1px solid #e3e8ed; white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid #f0f3f5; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #fafbfc; }
  td.site { font-weight: 600; color: #2c3a47; word-break: break-all; }
  td.site a { color: #2574a9; text-decoration: none; }
  td.site a:hover { text-decoration: underline; }
  .pw { font-family: Consolas, monospace; letter-spacing: 1px; }
  .tag { display: inline-block; background: #e8f6fb; color: #0088ad; border-radius: 10px; padding: 2px 9px; font-size: 12px; }
  .acts { white-space: nowrap; display: flex; gap: 6px; }
  .count { color: #8a96a3; font-size: 12px; margin-top: 10px; }

  /* MODAL */
  .modal-bg { position: fixed; inset: 0; background: rgba(20,30,40,.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 6px; width: 100%; max-width: 460px; padding: 24px; max-height: 92vh; overflow-y: auto; }
  .modal h2 { font-size: 17px; margin-bottom: 16px; }
  .modal label { display: block; font-size: 12px; color: #5b6772; margin: 12px 0 5px; }
  .modal input, .modal textarea { width: 100%; height: 38px; border: 1px solid #d3d9df; border-radius: 4px; padding: 0 12px; font-size: 14px; font-family: inherit; }
  .modal textarea { height: 180px; padding: 10px 12px; font-family: Consolas, monospace; font-size: 12px; }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: #00abdb; }
  .row { display: flex; gap: 8px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .hint { font-size: 12px; color: #8a96a3; margin-top: 6px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1d2c3a; color: #fff; padding: 10px 18px; border-radius: 4px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .toast.show { opacity: 1; }

  @media (max-width: 820px) {
    .sidebar { position: fixed; left: -230px; top: 0; bottom: 0; z-index: 9; transition: left .2s; }
    .sidebar.open { left: 0; }
    main { padding: 18px 16px 40px; }
    .panels { grid-template-columns: 1fr; }
    .hamb { display: inline-block; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="side">
    <div class="brand"><span>&#9919;</span> Gudang Password</div>
    <div class="acct"><div class="ava">M</div><div><b>muzadidil</b><small>muzadidil.zasha.online</small></div></div>
    <nav>
      <a data-route="dashboard" href="#dashboard">Dashboard</a>
      <a data-route="password" href="#password">Password</a>
      <a data-route="ssh" href="#ssh">SSH</a>
    </nav>
    <div class="side-foot"><button id="logout">Keluar</button></div>
  </aside>

  <main>
    <div class="top">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn hamb" id="hamb">&#9776;</button>
        <h1 id="title"></h1>
      </div>
      <div id="topActions"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let entries = [], filter = { q: '', tech: '' }, kind = 'password';
const L = () => kind === 'ssh'
  ? { title: 'SSH', site: 'Host / IP', ph: 'contoh: 103.12.34.56 atau srv1.zasha.online' }
  : { title: 'Password', site: 'Website', ph: 'contoh: pos.zasha.online' };

async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/login'; throw new Error('401'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Terjadi kesalahan');
  return d;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('Disalin');
}
const urlOf = w => /^https?:\/\//i.test(w) ? w : (/^[\w-]+(\.[\w-]+)+/.test(w) ? 'https://' + w : '');

/* ---------- DASHBOARD ---------- */
async function renderDashboard() {
  $('#title').textContent = 'Dashboard';
  $('#topActions').innerHTML = '';
  const s = await api('/api/stats');
  const max = Math.max(1, ...s.byTech.map(t => t.count));
  $('#view').innerHTML = `
    <div class="cards">
      <div class="card"><div class="lbl">Total Aplikasi</div><div class="val">${s.total}</div></div>
      <div class="card"><div class="lbl">Total SSH</div><div class="val">${s.sshTotal}</div></div>
      <div class="card"><div class="lbl">Jenis Teknologi</div><div class="val">${s.techCount}</div></div>
      <div class="card"><div class="lbl">Tanpa Password</div><div class="val">${s.noPassword}</div></div>
    </div>
    <div class="panels">
      <div class="panel"><h2>Aplikasi per Teknologi</h2>
        ${s.byTech.length ? s.byTech.map(t => `<div class="bar-row"><div class="nm" title="${esc(t.name)}">${esc(t.name)}</div><div class="track"><div class="fill" style="width:${t.count / max * 100}%"></div></div><div class="ct">${t.count}</div></div>`).join('') : '<div class="empty">Belum ada data.</div>'}
      </div>
      <div class="panel"><h2>Terakhir Diubah</h2>
        ${s.recent.length ? s.recent.map(e => `<div class="recent-row"><span>${esc(e.website)}</span><span class="tech">${esc(e.tech)}</span></div>`).join('') : '<div class="empty">Belum ada data.</div>'}
      </div>
    </div>`;
}

/* ---------- PASSWORD ---------- */
async function renderPassword() {
  $('#title').textContent = L().title;
  $('#topActions').innerHTML = `<button class="btn" id="btnImport">Impor</button> <button class="btn primary" id="btnAdd">+ Tambah</button>`;
  $('#btnAdd').onclick = () => openForm();
  $('#btnImport').onclick = openImport;
  $('#view').innerHTML = `
    <div class="tools">
      <input id="q" placeholder="Cari ${L().site.toLowerCase()}, user, atau teknologi..." value="${esc(filter.q)}">
      <select id="techSel"></select>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>${L().site}</th><th>User</th><th>Password</th><th>Teknologi</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div class="count" id="count"></div>`;
  $('#q').oninput = e => { filter.q = e.target.value; drawRows(); };
  entries = await api('/api/entries?kind=' + kind);
  const techs = [...new Set(entries.map(e => e.tech).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  $('#techSel').innerHTML = '<option value="">Semua teknologi</option>' + techs.map(t => `<option ${t === filter.tech ? 'selected' : ''}>${esc(t)}</option>`).join('');
  $('#techSel').onchange = e => { filter.tech = e.target.value; drawRows(); };
  drawRows();
}
function drawRows() {
  const q = filter.q.toLowerCase();
  const rows = entries.filter(e => (!filter.tech || e.tech === filter.tech) &&
    (!q || [e.website, e.user, e.tech].some(v => (v || '').toLowerCase().includes(q))))
    .sort((a, b) => a.website.localeCompare(b.website));
  $('#tbody').innerHTML = rows.length ? rows.map(e => {
    const u = urlOf(e.website);
    return `<tr data-id="${e.id}">
      <td class="site">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(e.website)}</a>` : esc(e.website)}</td>
      <td>${esc(e.user)} ${e.user ? `<button class="btn sm" data-a="cu">Salin</button>` : ''}</td>
      <td><span class="pw" data-pw>&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span></td>
      <td>${e.tech ? `<span class="tag">${esc(e.tech)}</span>` : ''}</td>
      <td><div class="acts">
        <button class="btn sm" data-a="show">Lihat</button>
        <button class="btn sm" data-a="cp">Salin</button>
        <button class="btn sm" data-a="edit">Ubah</button>
        <button class="btn sm danger" data-a="del">Hapus</button>
      </div></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty" style="text-align:center;padding:26px">Tidak ada data.</td></tr>';
  $('#count').textContent = `${rows.length} dari ${entries.length} aplikasi`;
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  const tr = b.closest('tr'), id = tr && tr.dataset.id, e = entries.find(x => x.id === id);
  if (!e) return;
  try {
    const a = b.dataset.a;
    if (a === 'cu') copy(e.user);
    else if (a === 'cp') copy((await api(`/api/entries/${id}/password`)).password);
    else if (a === 'show') {
      const span = tr.querySelector('[data-pw]');
      if (b.textContent === 'Sembunyi') { span.innerHTML = '&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;'; b.textContent = 'Lihat'; }
      else { span.textContent = (await api(`/api/entries/${id}/password`)).password || '(kosong)'; b.textContent = 'Sembunyi'; }
    }
    else if (a === 'edit') openForm(e);
    else if (a === 'del' && confirm(`Hapus "${e.website}"?`)) { await api(`/api/entries/${id}`, 'DELETE'); toast('Dihapus'); renderPassword(); }
  } catch (err) { if (err.message !== '401') toast(err.message); }
});

/* ---------- MODAL ---------- */
function openModal(html) { $('#modal').innerHTML = html; $('#modalBg').classList.add('open'); const i = $('#modal input,#modal textarea'); if (i) i.focus(); }
function closeModal() { $('#modalBg').classList.remove('open'); }
$('#modalBg').addEventListener('mousedown', e => { if (e.target.id === 'modalBg') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function genPass() {
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*';
  const a = new Uint32Array(16); crypto.getRandomValues(a);
  return [...a].map(n => cs[n % cs.length]).join('');
}
function openForm(e) {
  openModal(`<h2>${e ? 'Ubah' : 'Tambah'} ${L().title}</h2>
    <form id="form" autocomplete="off">
      <label>${L().site}</label><input name="website" value="${esc(e?.website)}" placeholder="${esc(L().ph)}" required>
      <label>User</label><input name="user" value="${esc(e?.user)}">
      <label>Password</label>
      <div class="row"><input name="password" id="pwInput" placeholder="${e ? 'Kosongkan jika tidak diubah' : ''}"><button type="button" class="btn" id="gen">Acak</button></div>
      <label>Teknologi</label><input name="tech" list="techList" value="${esc(e?.tech)}" placeholder="contoh: Laravel, Express.js">
      <datalist id="techList">${[...new Set(entries.map(x => x.tech).filter(Boolean))].map(t => `<option value="${esc(t)}">`).join('')}</datalist>
      <div class="foot"><button type="button" class="btn" id="cancel">Batal</button><button class="btn primary">Simpan</button></div>
    </form>`);
  $('#cancel').onclick = closeModal;
  $('#gen').onclick = () => { $('#pwInput').value = genPass(); };
  $('#form').onsubmit = async ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    try {
      if (e) { if (f.password === '') delete f.password; await api(`/api/entries/${e.id}`, 'PUT', f); }
      else await api('/api/entries', 'POST', { ...f, kind });
      closeModal(); toast('Tersimpan'); renderPassword();
    } catch (err) { if (err.message !== '401') toast(err.message); }
  };
}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  const delim = text.split('\n')[0].includes('\t') ? '\t' : (text.split('\n')[0].includes(';') && !text.split('\n')[0].includes(',') ? ';' : ',');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function openImport() {
  openModal(`<h2>Impor Massal</h2>
    <p class="hint" style="margin:0 0 6px">Tempel data dengan urutan kolom: <b>${L().site.toLowerCase()}, user, password, teknologi</b> (CSV / tab dari Excel). Baris header "website" otomatis dilewati.</p>
    <textarea id="csv" placeholder="pos.zasha.online,admin,rahasia123,Laravel"></textarea>
    <div class="foot"><button class="btn" id="cancel">Batal</button><button class="btn primary" id="go">Impor</button></div>`);
  $('#cancel').onclick = closeModal;
  $('#go').onclick = async () => {
    let rows = parseCSV($('#csv').value);
    if (rows.length && /^website$/i.test(rows[0][0].trim())) rows.shift();
    const data = rows.map(r => ({ kind, website: r[0] || '', user: r[1] || '', password: r[2] || '', tech: r[3] || '' }));
    if (!data.length) return toast('Tidak ada baris');
    try { const r = await api('/api/import', 'POST', data); closeModal(); toast(`${r.imported} baris diimpor`); renderPassword(); }
    catch (err) { if (err.message !== '401') toast(err.message); }
  };
}

/* ---------- ROUTER ---------- */
async function route() {
  const h = location.hash.replace('#', '');
  const r = h === 'password' || h === 'ssh' ? h : 'dashboard';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.route === r));
  $('#side').classList.remove('open');
  if (r !== 'dashboard') { if (kind !== r) filter = { q: '', tech: '' }; kind = r; }
  try { await (r === 'dashboard' ? renderDashboard() : renderPassword()); } catch (e) { if (e.message !== '401') toast(e.message); }
}
window.addEventListener('hashchange', route);
$('#hamb').onclick = () => $('#side').classList.toggle('open');
$('#logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/login'; };
route();
</script>
</body>
</html>
