<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d2c3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gudang">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Gudang Password - muzadidil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; color: #333; background: #fff; }
  button { font-family: inherit; }
  .app { display: flex; height: 100vh; height: 100dvh; }
  .scrim { display: none; }

  /* SIDEBAR */
  .sidebar { width: 220px; background: #1d2c3a; color: #c5ced6; display: flex; flex-direction: column; flex-shrink: 0; user-select: none; }
  .brand { height: 76px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #16222d; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .3px; flex-shrink: 0; }
  .brand span { color: #00abdb; margin-right: 6px; }
  .acct { padding: 14px 22px; border-bottom: 1px solid #16222d; display: flex; align-items: center; gap: 10px; font-size: 12px; flex-shrink: 0; }
  .ava { width: 34px; height: 34px; border-radius: 50%; background: #2574a9; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .acct b { color: #fff; display: block; font-size: 13px; }
  .acct small { color: #9aa8b6; }
  nav { flex: 1; padding: 6px 0; overflow-y: auto; }
  nav a { display: block; padding: 13px 22px; font-size: 13px; color: #c5ced6; text-decoration: none; cursor: pointer; border-left: 3px solid transparent; }
  nav a:hover { color: #fff; background: #223344; }
  nav a.active { color: #fff; font-weight: 600; background: #223344; border-left-color: #00abdb; }
  nav a.grp-h { display: flex; align-items: center; }
  nav a.grp-h .caret { display: inline-block; width: 14px; font-size: 10px; color: #9aa8b6; transition: transform .15s; margin-right: 4px; }
  nav a.grp-h.open { color: #fff; font-weight: 600; }
  nav a.grp-h.open .caret { transform: rotate(90deg); color: #fff; }
  nav a.sublink { padding: 11px 22px 11px 44px; font-size: 12.5px; }
  .nav-sep { height: 1px; background: #283a4b; margin: 8px 0; }
  .side-foot { padding: 16px 22px; border-top: 1px solid #283a4b; background: #1f2f3e; flex-shrink: 0; }
  .side-foot button { width: 100%; height: 32px; background: none; border: 1px solid #3a4f63; color: #ff8a8a; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .side-foot button:hover { background: #2a3d50; }

  /* MAIN */
  main { flex: 1; min-width: 0; overflow-y: auto; padding: 26px 34px 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 600; color: #2c3a47; }
  .btn { height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid #d3d9df; background: #fff; color: #444; cursor: pointer; font-size: 13px; }
  .btn:hover { background: #f4f6f8; }
  .btn.primary { background: #00abdb; border-color: #00abdb; color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #0099c4; }
  .btn.danger { color: #e0443e; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
  .hamb { display: none; }

  /* DASHBOARD */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { border: 1px solid #e3e8ed; border-radius: 6px; padding: 18px 20px; }
  .card .lbl { font-size: 12px; color: #8a96a3; text-transform: uppercase; letter-spacing: .5px; }
  .card .val { font-size: 32px; font-weight: 600; color: #2c3a47; margin-top: 6px; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .panel { border: 1px solid #e3e8ed; border-radius: 6px; padding: 18px 20px; }
  .panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: #2c3a47; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .bar-row .nm { width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .track { flex: 1; height: 10px; background: #eef2f5; border-radius: 5px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: #00abdb; border-radius: 5px; }
  .bar-row .ct { width: 32px; text-align: right; color: #5b6772; }
  .recent-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f0f3f5; font-size: 13px; gap: 10px; }
  .recent-row:last-child { border: 0; }
  .recent-row .tech { color: #8a96a3; flex-shrink: 0; }
  .empty { color: #8a96a3; font-size: 13px; padding: 8px 0; }

  /* TABEL */
  .tools { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .tools input, .tools select { height: 36px; border: 1px solid #d3d9df; border-radius: 4px; padding: 0 12px; font-size: 13px; background: #fff; }
  .tools input { flex: 1; min-width: 200px; }
  .tools input:focus, .tools select:focus { outline: none; border-color: #00abdb; }
  .tbl-wrap { border: 1px solid #e3e8ed; border-radius: 6px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; background: #f6f8fa; color: #5b6772; font-weight: 600; padding: 11px 14px; border-bottom: 1px solid #e3e8ed; white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid #f0f3f5; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #fafbfc; }
  td.site { font-weight: 600; color: #2c3a47; word-break: break-all; }
  td.site a { color: #2574a9; text-decoration: none; }
  td.site a:hover { text-decoration: underline; }
  .pw { font-family: Consolas, monospace; letter-spacing: 1px; }
  .tag { display: inline-block; background: #e8f6fb; color: #0088ad; border-radius: 10px; padding: 2px 9px; font-size: 12px; }
  .acts { white-space: nowrap; display: flex; gap: 6px; }
  .count { color: #8a96a3; font-size: 12px; margin-top: 10px; }

  /* FORM / MODAL */
  .fld { width: 100%; height: 38px; border: 1px solid #d3d9df; border-radius: 4px; padding: 0 12px; font-size: 14px; font-family: inherit; background: #fff; }
  .fld:focus { outline: none; border-color: #00abdb; }
  .lbl2 { display: block; font-size: 12px; color: #5b6772; margin: 12px 0 5px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(20,30,40,.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 6px; width: 100%; max-width: 460px; padding: 24px; max-height: 92vh; overflow-y: auto; }
  .modal h2 { font-size: 17px; margin-bottom: 16px; }
  .modal textarea { width: 100%; height: 180px; border: 1px solid #d3d9df; border-radius: 4px; padding: 10px 12px; font-family: Consolas, monospace; font-size: 12px; }
  .modal textarea:focus { outline: none; border-color: #00abdb; }
  .row { display: flex; gap: 8px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  /* indikator kekuatan password + Password Maker */
  .meter { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .meter[hidden] { display: none; }
  .meter-bars { display: flex; gap: 4px; flex: 1; }
  .meter-bars i { flex: 1; height: 6px; border-radius: 3px; background: #e3e8ed; }
  .meter[data-l="0"] .meter-bars i:nth-child(-n+1) { background: #e0443e; }
  .meter[data-l="1"] .meter-bars i:nth-child(-n+2) { background: #f0a020; }
  .meter[data-l="2"] .meter-bars i:nth-child(-n+3) { background: #5cb85c; }
  .meter[data-l="3"] .meter-bars i:nth-child(-n+4) { background: #1b8a4b; }
  .meter-lbl { font-size: 12px; font-weight: 600; min-width: 78px; text-align: right; }
  .meter[data-l="0"] .meter-lbl { color: #e0443e; } .meter[data-l="1"] .meter-lbl { color: #d58512; }
  .meter[data-l="2"] .meter-lbl { color: #3d9a3d; } .meter[data-l="3"] .meter-lbl { color: #1b8a4b; }
  .meter-tip { font-size: 11.5px; color: #8a96a3; margin-top: 4px; }
  details.pm { margin-top: 12px; border: 1px solid #e3e8ed; border-radius: 6px; padding: 0 12px; }
  details.pm summary { cursor: pointer; padding: 11px 0; font-size: 13px; font-weight: 600; color: #2574a9; }
  details.pm[open] summary { border-bottom: 1px solid #f0f3f5; margin-bottom: 4px; }
  .pm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .pm-grid .lbl2 { margin-top: 10px; }
  .pm-radios { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0 4px; font-size: 13px; }
  .pm-radios label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .pm-out { font-family: Consolas, monospace; font-size: 17px; letter-spacing: .5px; background: #f6f8fa; border: 1px dashed #c9d2da; border-radius: 4px; padding: 11px 12px; margin-top: 12px; word-break: break-all; min-height: 44px; }
  .pm-actions { display: flex; gap: 8px; margin: 10px 0 12px; }
  @media (max-width: 480px) { .pm-grid { grid-template-columns: 1fr; } }
  .hint { font-size: 12px; color: #8a96a3; margin-top: 6px; line-height: 1.5; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1d2c3a; color: #fff; padding: 10px 18px; border-radius: 4px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; max-width: 90vw; }
  .toast.show { opacity: 1; }

  /* KELOLA MENU */
  .mrow { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .mrow.child { margin-left: 28px; }
  .mrow .fld { height: 34px; font-size: 13px; }
  .mrow .mlabel { flex: 2; min-width: 0; }
  .mrow .msite { flex: 1.2; min-width: 0; }
  .mrow .msite-ph { flex: 1.2; }
  .mgroup { border-bottom: 1px solid #f0f3f5; padding-bottom: 6px; margin-bottom: 10px; }

  @media (max-width: 820px) {
    .sidebar { position: fixed; left: -240px; top: 0; bottom: 0; width: 240px; z-index: 30; transition: left .2s; padding-top: env(safe-area-inset-top); }
    .sidebar.open { left: 0; box-shadow: 4px 0 24px rgba(0,0,0,.4); }
    .scrim { position: fixed; inset: 0; background: rgba(10,18,26,.55); z-index: 25; }
    .sidebar.open ~ .scrim { display: block; }
    main { padding: calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom)); }
    .hamb { display: inline-block; height: 40px; width: 44px; padding: 0; font-size: 18px; }
    h1 { font-size: 19px; }
    .top { margin-bottom: 14px; }
    nav a { padding: 15px 22px; font-size: 14px; }
    nav a.sublink { padding: 13px 22px 13px 44px; }
    .btn { height: 40px; }
    .btn.sm { height: 34px; padding: 0 12px; }
    .fld, .tools input, .tools select { font-size: 16px; height: 44px; } /* 16px mencegah zoom otomatis di iOS */
    .cards { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 14px; } .card .val { font-size: 26px; }
    .panels { grid-template-columns: 1fr; }
    .mrow { flex-wrap: wrap; }
    .mrow .mlabel { flex: 1 1 100%; } .mrow .msite { flex: 1 1 100%; }
    .mrow.child { margin-left: 14px; }
    .modal-bg { align-items: flex-end; padding: 0; }
    .modal { max-width: none; border-radius: 14px 14px 0 0; max-height: 94dvh; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
    .toast { bottom: calc(22px + env(safe-area-inset-bottom)); }
  }
  /* tabel menjadi kartu di layar sempit */
  @media (max-width: 640px) {
    .tbl-wrap { border: 0; overflow: visible; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr { border: 1px solid #e3e8ed; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #fff; }
    tr:hover td { background: none; }
    td { border: 0; padding: 5px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: right; }
    td::before { content: attr(data-label); color: #8a96a3; font-size: 12px; text-align: left; flex-shrink: 0; }
    td.site { font-size: 15px; text-align: left; justify-content: flex-start; }
    td.site::before, td.acts-cell::before { display: none; }
    td.acts-cell { padding-top: 10px; margin-top: 4px; border-top: 1px solid #f0f3f5; }
    .acts { width: 100%; justify-content: space-between; }
    .acts .btn { flex: 1; }
    td.empty { display: block; text-align: center; }
    td.empty::before { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="side">
    <div class="brand"><span>&#9919;</span> Gudang Password</div>
    <div class="acct"><div class="ava">M</div><div><b>muzadidil</b><small>muzadidil.zasha.online</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><button id="logout">Keluar</button></div>
  </aside>

  <main>
    <div class="top">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn hamb" id="hamb">&#9776;</button>
        <h1 id="title"></h1>
      </div>
      <div id="topActions"></div>
    </div>
    <div id="view"></div>
  </main>
  <div class="scrim" id="scrim"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let entries = [], filter = { q: '', tech: '' }, kind = 'password';
let menu = [], openGroups = new Set(), currentRoute = 'dashboard';

async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/login'; throw new Error('401'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Terjadi kesalahan');
  return d;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800 + msg.length * 40); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('Disalin');
}
const urlOf = w => /^https?:\/\//i.test(w) ? w : (/^[\w-]+(\.[\w-]+)+/.test(w) ? 'https://' + w : '');
const newId = () => 'm' + Math.random().toString(36).slice(2, 8);

/* ---------- MENU / SIDEBAR ---------- */
const leaves = () => menu.flatMap(p => p.children.length
  ? p.children.map(c => ({ ...c, path: p.label + ' › ' + c.label }))
  : [{ ...p, path: p.label }]);
const L = () => {
  const l = leaves().find(x => x.id === kind) || { site: 'Website', path: kind };
  return { title: l.path, site: l.site || 'Website', ph: l.site === 'Host / IP' ? 'contoh: 103.12.34.56' : 'contoh: pos.zasha.online' };
};
async function loadMenu() { menu = await api('/api/menu'); }
function buildNav() {
  const r = currentRoute;
  const a = (route, label, cls = '') => `<a class="${cls}${r === route ? ' active' : ''}" data-route="${esc(route)}" href="#${esc(route)}">${esc(label)}</a>`;
  let h = a('dashboard', 'Dashboard');
  for (const p of menu) {
    if (p.children.length) {
      const open = openGroups.has(p.id);
      h += `<a class="grp-h${open ? ' open' : ''}" data-grp="${esc(p.id)}"><span class="caret">&#9656;</span>${esc(p.label)}</a>`;
      if (open) h += p.children.map(c => a('m/' + c.id, c.label, 'sublink')).join('');
    } else h += a('m/' + p.id, p.label);
  }
  h += '<div class="nav-sep"></div>' + a('menu', 'Kelola Menu') + a('akun', 'Akun');
  $('#nav').innerHTML = h;
}
$('#nav').addEventListener('click', e => {
  const g = e.target.closest('[data-grp]');
  if (!g) return;
  const id = g.dataset.grp;
  openGroups.has(id) ? openGroups.delete(id) : openGroups.add(id);
  buildNav();
});

/* ---------- DASHBOARD ---------- */
async function renderDashboard() {
  $('#title').textContent = 'Dashboard';
  $('#topActions').innerHTML = '';
  const s = await api('/api/stats');
  const bars = list => {
    const max = Math.max(1, ...list.map(t => t.count));
    return list.length ? list.map(t => `<div class="bar-row"><div class="nm" title="${esc(t.name)}">${esc(t.name)}</div><div class="track"><div class="fill" style="width:${t.count / max * 100}%"></div></div><div class="ct">${t.count}</div></div>`).join('') : '<div class="empty">Belum ada data.</div>';
  };
  $('#view').innerHTML = `
    <div class="cards">
      <div class="card"><div class="lbl">Total Data</div><div class="val">${s.total}</div></div>
      <div class="card"><div class="lbl">Jumlah Menu</div><div class="val">${s.menuCount}</div></div>
      <div class="card"><div class="lbl">Jenis Teknologi</div><div class="val">${s.techCount}</div></div>
      <div class="card"><div class="lbl">Tanpa Password</div><div class="val">${s.noPassword}</div></div>
    </div>
    <div class="panels">
      <div class="panel"><h2>Data per Menu</h2>${bars(s.byMenu)}</div>
      <div class="panel"><h2>Data per Teknologi</h2>${bars(s.byTech)}</div>
      <div class="panel"><h2>Terakhir Diubah</h2>
        ${s.recent.length ? s.recent.map(e => `<div class="recent-row"><span>${esc(e.website)}</span><span class="tech">${esc(e.tech)}</span></div>`).join('') : '<div class="empty">Belum ada data.</div>'}
      </div>
    </div>`;
}

/* ---------- DAFTAR DATA (satu per menu) ---------- */
async function renderList() {
  $('#title').textContent = L().title;
  $('#topActions').innerHTML = `<button class="btn" id="btnImport">Impor</button> <button class="btn primary" id="btnAdd">+ Tambah</button>`;
  $('#btnAdd').onclick = () => openForm();
  $('#btnImport').onclick = openImport;
  $('#view').innerHTML = `
    <div class="tools">
      <input id="q" placeholder="Cari ${esc(L().site.toLowerCase())}, user, atau teknologi..." value="${esc(filter.q)}">
      <select id="techSel"></select>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>${esc(L().site)}</th><th>User</th><th>Password</th><th>Teknologi</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div class="count" id="count"></div>`;
  $('#q').oninput = e => { filter.q = e.target.value; drawRows(); };
  entries = await api('/api/entries?kind=' + encodeURIComponent(kind));
  const techs = [...new Set(entries.map(e => e.tech).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  $('#techSel').innerHTML = '<option value="">Semua teknologi</option>' + techs.map(t => `<option ${t === filter.tech ? 'selected' : ''}>${esc(t)}</option>`).join('');
  $('#techSel').onchange = e => { filter.tech = e.target.value; drawRows(); };
  drawRows();
}
function drawRows() {
  const q = filter.q.toLowerCase();
  const rows = entries.filter(e => (!filter.tech || e.tech === filter.tech) &&
    (!q || [e.website, e.user, e.tech].some(v => (v || '').toLowerCase().includes(q))))
    .sort((a, b) => a.website.localeCompare(b.website));
  $('#tbody').innerHTML = rows.length ? rows.map(e => {
    const u = urlOf(e.website);
    return `<tr data-id="${esc(e.id)}">
      <td class="site">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(e.website)}</a>` : esc(e.website)}</td>
      <td data-label="User"><span>${esc(e.user)} ${e.user ? `<button class="btn sm" data-a="cu">Salin</button>` : ''}</span></td>
      <td data-label="Password"><span class="pw" data-pw>&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span></td>
      <td data-label="Teknologi">${e.tech ? `<span class="tag">${esc(e.tech)}</span>` : '<span></span>'}</td>
      <td class="acts-cell"><div class="acts">
        <button class="btn sm" data-a="show">Lihat</button>
        <button class="btn sm" data-a="cp">Salin</button>
        <button class="btn sm" data-a="edit">Ubah</button>
        <button class="btn sm danger" data-a="del">Hapus</button>
      </div></td></tr>`;
  }).join('') : '<tr><td colspan="5" class="empty" style="text-align:center;padding:26px">Tidak ada data.</td></tr>';
  $('#count').textContent = `${rows.length} dari ${entries.length} data`;
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  const tr = b.closest('tr'), id = tr && tr.dataset.id, e = entries.find(x => x.id === id);
  if (!e) return;
  try {

function genPass() {
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*';
  const a = new Uint32Array(16); crypto.getRandomValues(a);
  return [...a].map(n => cs[n % cs.length]).join('');
}
/* ---------- KEKUATAN PASSWORD & PASSWORD MAKER ---------- */
const LEVELS = ['Easy', 'Middle', 'Strong', 'Very Strong'];
function strength(pw) {
  const chars = [...pw], low = pw.toLowerCase();
  const pool = (/[a-z]/.test(pw) ? 26 : 0) + (/[A-Z]/.test(pw) ? 26 : 0) + (/\d/.test(pw) ? 10 : 0) + (/[^A-Za-z0-9]/.test(pw) ? 33 : 0);
  let eff = chars.length;
  const seen = new Set(); let rep = 0;
  for (const c of chars) seen.has(c) ? rep++ : seen.add(c);
  eff -= rep * 0.6; // karakter berulang dihitung lebih lemah
  const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm', '1234567890', 'abcdefghijklmnopqrstuvwxyz', 'qazwsxedcrfvtgbyhnujmikolp'];
  for (let i = 0; i + 3 <= low.length; i++) { // urutan seperti abc, 123, qwe, qaz
    const t = low.slice(i, i + 3);
    if (rows.some(r => r.includes(t) || [...r].reverse().join('').includes(t))) eff -= 1;
  }
  let bits = Math.max(0, eff) * Math.log2(Math.max(pool, 2));
  const weak = ['password', 'passw0rd', 'admin', 'qwerty', 'letmein', 'welcome', '123456', '111111', 'iloveyou'].some(w => low.includes(w));
  if (weak) bits = Math.min(bits, 25);
  const level = bits < 32 ? 0 : bits < 52 ? 1 : bits < 72 ? 2 : 3;
  const tips = [];
  if (weak) tips.push('mengandung kata umum');
  if (chars.length < 12) tips.push('perpanjang minimal 12 karakter');
  if (!/[A-Z]/.test(pw)) tips.push('tambah huruf kapital');
  if (!/[a-z]/.test(pw)) tips.push('tambah huruf kecil');
  if (!/\d/.test(pw)) tips.push('tambah angka');
  if (!/[^A-Za-z0-9]/.test(pw)) tips.push('tambah simbol');
  return { level, label: LEVELS[level], bits: Math.round(bits), tips };
}
function meterHTML(id) {
  return `<div id="${id}" hidden><div class="meter" data-l="0"><div class="meter-bars"><i></i><i></i><i></i><i></i></div><span class="meter-lbl"></span></div><div class="meter-tip"></div></div>`;
}
function setMeter(sel, pw) {
  const box = $(sel); if (!box) return;
  if (!pw) { box.hidden = true; return; }
  const s = strength(pw);
  box.hidden = false;
  box.querySelector('.meter').dataset.l = s.level;
  box.querySelector('.meter-lbl').textContent = s.label;
  box.querySelector('.meter-tip').textContent = `≈ ${s.bits} bit` + (s.tips.length ? ' • saran: ' + s.tips.slice(0, 3).join(', ') : '');
}
function randInt(n) { // acak kriptografis tanpa bias
  const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do crypto.getRandomValues(a); while (a[0] >= lim);
  return a[0] % n;
}
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function extraChars(n, o) {
  const sets = [o.lower && 'abcdefghijkmnopqrstuvwxyz', o.upper && 'ABCDEFGHJKLMNPQRSTUVWXYZ', o.digits && '23456789', o.symbols && '!@#$%&*?'].filter(Boolean);
  const pool = [...(sets.length ? sets.join('') : 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*?')];
  return Array.from({ length: n }, () => pool[randInt(pool.length)]);
}
function makePassword(o) {
  const L = [...o.lower], U = [...o.upper], D = [...o.digits], S = o.symbols;
  const extra = extraChars(Math.max(0, Math.min(32, o.extra | 0)), o);
  if (o.mode === 'acak') return shuffle([...L, ...U, ...D, ...S, ...extra]).join('');
  // urut: teks (kapital+huruf) berurutan, angka dibagi rata di sela-selanya, lalu karakter acak, lalu simbol
  const base = o.first === 'lower' ? [...L, ...U] : [...U, ...L];
  let out = '';
  if (!base.length) out = D.join('');
  else {
    const per = Math.floor(D.length / base.length), rem = D.length % base.length;
    let k = 0;
    base.forEach((ch, i) => { const take = per + (i < rem ? 1 : 0); out += ch + D.slice(k, k + take).join(''); k += take; });
  }
  return out + extra.join('') + S;
}
function bindMaker() {
  const ids = ['pmLower', 'pmDigits', 'pmSymbols', 'pmUpper', 'pmFirst', 'pmExtra'];
  const read = () => ({
    lower: $('#pmLower').value, digits: $('#pmDigits').value, symbols: $('#pmSymbols').value, upper: $('#pmUpper').value,
    first: $('#pmFirst').value, extra: Number($('#pmExtra').value) || 0,
    mode: (document.querySelector('input[name="pmMode"]:checked') || {}).value || 'urut',
  });
  const draw = () => {
    const o = read();
    $('#pmFirstWrap').style.display = o.mode === 'urut' ? '' : 'none';
    const pw = (o.lower || o.digits || o.symbols || o.upper || o.extra) ? makePassword(o) : '';
    $('#pmOut').textContent = pw || 'Isi komponen di atas';
    $('#pmOut').dataset.pw = pw;
    setMeter('#pmMeter', pw);
  };
  ids.forEach(i => $('#' + i).addEventListener('input', draw));
  document.querySelectorAll('input[name="pmMode"]').forEach(r => r.addEventListener('change', draw));
  $('#pmAgain').onclick = draw;
  $('#pmUse').onclick = () => {
    const pw = $('#pmOut').dataset.pw;
    if (!pw) return toast('Isi komponen dulu');
    $('#pwInput').value = pw; setMeter('#pwMeter', pw); toast('Password dipakai');
  };
  draw();
}

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  const first = text.split('\n')[0];
  const delim = first.includes('\t') ? '\t' : (first.includes(';') && !first.includes(',') ? ';' : ',');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function openImport() {

    if (!data.length) return toast('Tidak ada baris');
    try { const r = await api('/api/import', 'POST', data); closeModal(); toast(`${r.imported} baris diimpor`); renderList(); }
    catch (err) { if (err.message !== '401') toast(err.message); }
  };
}

  $('#title').textContent = 'Kelola Menu';

  $('#view').innerHTML = `
    <div class="panel" style="max-width:720px">

      <p class="hint" style="margin:-6px 0 16px">Menu tanpa sub adalah satu daftar data. Menu yang punya sub hanya jadi pengelompok; datanya ada di sub-menunya. "Judul kolom" adalah nama kolom pertama di tabel, misalnya Website atau Host / IP.</p>

      <div style="display:flex;gap:10px;margin-top:14px">

        <button class="btn primary" id="saveMenu">Simpan</button>
      </div>
    </div>`;
  $('#mtree').oninput = ev => {
    const t = ev.target; if (!t.dataset.f) return;
    const p = draft[+t.dataset.p], n = t.dataset.c !== undefined ? p.children[+t.dataset.c] : p;
    n[t.dataset.f] = t.value;
  };
  $('#mtree').onclick = ev => {
    const b = ev.target.closest('[data-m]'); if (!b) return;
    const p = +b.dataset.p, c = b.dataset.c !== undefined ? +b.dataset.c : null;
    const arr = c === null ? draft : draft[p].children, i = c === null ? p : c, act = b.dataset.m;
    if (act === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    else if (act === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    else if (act === 'sub') draft[p].children.push({ id: newId(), label: 'Sub baru', site: draft[p].site || 'Website' });
    else if (act === 'del') {
      const name = c === null ? draft[p].label : draft[p].children[c].label;
      if (!confirm(`Hapus menu "${name}"?${c === null && draft[p].children.length ? ' Sub-menunya ikut terhapus.' : ''}`)) return;
      arr.splice(i, 1);
    }
    drawTree();
  };
  $('#addParent').onclick = () => { draft.push({ id: newId(), label: 'Menu baru', site: 'Website', children: [] }); drawTree(); };
  $('#saveMenu').onclick = async () => {
    if (draft.some(p => !p.label.trim() || p.children.some(c => !c.label.trim()))) return toast('Nama menu tidak boleh kosong');
    try { menu = await api('/api/menu', 'PUT', draft); buildNav(); toast('Menu tersimpan'); renderMenuEditor(); }
    catch (err) { if (err.message !== '401') toast(err.message); }
  };

}
function drawTree() {
  const btn = (m, p, c, t, cls = '') => `<button class="btn sm ${cls}" data-m="${m}" data-p="${p}" ${c !== undefined ? `data-c="${c}"` : ''}>${t}</button>`;

    <div class="mgroup">

      </div>
      ${p.children.map((c, ci) => `
      <div class="mrow child">
        <input class="fld mlabel" data-f="label" data-p="${pi}" data-c="${ci}" value="${esc(c.label)}" placeholder="Nama sub-menu" maxlength="40">

      </div>`).join('')}
    </div>`).join('');
}

/* ---------- ROUTER ---------- */
async function route() {
  let h = location.hash.replace('#', '');
  if (h === 'password' || h === 'ssh') h = 'm/' + h; // tautan lama
  let r = 'dashboard';
  if (h === 'akun' || h === 'menu') r = h;
  else if (h.startsWith('m/') && leaves().some(l => 'm/' + l.id === h)) r = h;
  currentRoute = r;
  if (r.startsWith('m/')) {
    const id = r.slice(2);
    if (kind !== id) filter = { q: '', tech: '' };
    kind = id;
    const par = menu.find(p => p.children.some(c => c.id === id));
    if (par) openGroups.add(par.id);
  }
  buildNav();
  $('#side').classList.remove('open');
  try {
    if (r === 'dashboard') await renderDashboard();
    else if (r === 'akun') await renderAkun();
    else if (r === 'menu') renderMenuEditor();
    else await renderList();
  } catch (e) { if (e.message !== '401') toast(e.message); }
}
window.addEventListener('hashchange', route);

$('#scrim').onclick = () => $('#side').classList.remove('open');
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

loadMenu().then(route).catch(e => { if (e.message !== '401') toast(e.message); });
